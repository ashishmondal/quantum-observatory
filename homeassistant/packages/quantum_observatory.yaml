# ---------------------------------------------------------------------
# observatory/iss — REST sensors feed pyscript publisher
# ---------------------------------------------------------------------
#
# Two public REST endpoints (both free, no key required):
#   * api.wheretheiss.at  — current sub-satellite lat/lon/altitude/
#                           visibility (rate limit 350 req / 5 min;
#                           we poll every 30 s with 97% headroom)
#   * api.open-notify.org/astros — current ISS crew count (poll hourly)
#
# Both wrap into HA `rest` sensors so the polling cadence is explicit
# and HA caches/retries the values. The pyscript publisher
# (../pyscript/observatory_publisher.py → publish_iss) reads these
# sensor states every 30 s, combines them with a skyfield-computed
# next-pass time (from a CelesTrak TLE, refreshed every 6 h), and
# publishes the full observatory/iss payload per docs/MQTT_TOPICS.md.
#
# The previous YAML automation that did the publish lived here and
# had two bugs: it mapped sunlit = (visibility == "daylight"), which
# silently dropped the visibility=="visible" dusk/dawn case (i.e. the
# entire reason ISS is observable from the ground); and it sourced
# next-pass from open-notify's /iss-pass.json, which has been HTTP 404
# since ~2021 and made the panel render "VIS SOON" forever.

rest:
  # Live ISS sub-satellite point (poll every 30 s).
  - resource: https://api.wheretheiss.at/v1/satellites/25544
    scan_interval: 30
    sensor:
      - name: "ISS Position"
        unique_id: observatory_iss_position
        # Compact value_template — HA truncates long ones in the UI.
        # The full payload lives in attributes for the publisher.
        value_template: "{{ value_json.latitude | round(2) }}"
        json_attributes:
          - latitude
          - longitude
          - altitude
          - visibility   # WTIA's misleadingly-named field — really
                         # means "is the satellite itself sunlit"
                         # (tri-state: daylight | visible | eclipsed)

  # Current ISS crew count.
  - resource: http://api.open-notify.org/astros.json
    scan_interval: 3600
    sensor:
      - name: "ISS Crew Count"
        unique_id: observatory_iss_crew_count
        value_template: >-
          {{ value_json.people | selectattr('craft','eq','ISS') | list | count }}

# observatory_iss automation — SUPERSEDED BY PYSCRIPT
# (see ../pyscript/observatory_publisher.py → publish_iss).
# Re-enable here only if you uninstall pyscript; in that case you
# also lose seconds_until_next (no skyfield → no SGP4 propagation),
# and you must restore the `sunlit = (visibility != "eclipsed")`
# mapping noted in the comment header above.

# ---------------------------------------------------------------------
# observatory/planet — SUPERSEDED BY PYSCRIPT (see pyscript/observatory_publisher.py)
# ---------------------------------------------------------------------
#
# Was: a body-specific stub (`observatory/jupiter`) that published a
# fixed "BELOW horizon" payload every 15 min because HA ships no
# planetary ephemeris. When the jupiter scene was generalised into
# the `planets` scene, the wire moved to `observatory/planet` carrying
# `{name, bearing_deg, elevation_deg, constellation_index}` so HA can
# pick any supported body. Pyscript + skyfield gives the real numbers
# (see publish_planet() in observatory_publisher.py).
#
# To re-enable for an HA-only install, define an automation that
# publishes a `{"name":"jupiter","bearing_deg":...,"elevation_deg":
# ...,"constellation_index":...}` payload to `observatory/planet`
# on a 15 min cadence — the firmware will only paint the live
# overlay when the scene's active body matches `name`.

