# ---------------------------------------------------------------------
# observatory/scene — evening rotation
# ---------------------------------------------------------------------
#
# Defaults: clock during the day, rotate the four real "observatory"
# scenes during prime sky-watching hours (sunset to bedtime), then
# the LDR night scene takes over automatically (FR-7.2) once the
# room dims.
#
# Priorities (per FR-2.1):
#   - 1 = passive demo (nothing else asking for attention)
#   - 2 = scheduled featured scene (evening rotation, this file)
#   - 3 = sticky featured (e.g. moon_phase override from a button)
#   - 4 = breaking event (ISS visible, default for `iss_pass`)
# We push at priority 2 so a real-time `iss_pass` push from
# `observatory/iss` (priority 4 inside the firmware) still preempts.
#
# `duration` matches the rotation cadence so each scene auto-expires
# back to the firmware default just as the next push arrives — a
# missed publish therefore degrades gracefully to the giant clock
# instead of leaving a stale scene up.

automation observatory_evening_rotation:
  - id: observatory_evening_rotation
    alias: "Observatory — rotate featured scenes (07:00 → 22:30)"
    description: >-
      Cycles featured scenes every 5 minutes throughout the waking
      day. Halts before bedtime so the LDR-driven night mode
      (FR-7.2) takes over cleanly; the LDR override is the real
      night gate (a covered sensor at noon still suppresses
      everything) — the 22:30 cutoff is belt + braces for the case
      where the room stays lit past bedtime.
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      # Waking-hours window. No `sun.sun` condition any more — the
      # cycle now runs during the day too so scenes like
      # launch_countdown (which is meaningful 24/7, not just at
      # twilight) get airtime. Firmware-side NIGHT override (LDR,
      # FR-7.2) is the authoritative dark-room gate; this 07:00 /
      # 22:30 window just prevents a published-but-overridden
      # scene from sitting in the latch when the room is dark.
      - condition: template
        value_template: "{{ now().hour >= 7 and (now().hour < 22 or (now().hour == 22 and now().minute < 30)) }}"
    variables:
      # 6-step cycle. launch_countdown joins the rotation because it
      # carries 24/7-relevant data (next scheduled liftoff is
      # interesting at 10 a.m. as well as 9 p.m.) and the
      # launch_imminent auto-switch only fires inside the final 5
      # min anyway — the rest of the day this rotation slot is the
      # only way the scene gets airtime. `tick` is "minutes since
      # midnight / 5", giving a stable rotation that doesn't reset
      # on HA restart.
      scenes:
        - clock
        - moon_phase
        - planets
        - iss_pass
        - constellation_now
        - launch_countdown
        - exoplanet_count
      tick: "{{ ((now().hour * 60 + now().minute) // 5) % (scenes | length) }}"
      scene_id: "{{ scenes[tick] }}"
    actions:
      - action: mqtt.publish
        data:
          topic: observatory/scene
          qos: 1            # see observatory/time block for rationale
          payload: >-
            {{ {
              "scene_id": scene_id,
              "priority": 2,
              "duration": 300,
              "sticky": false
            } | tojson }}

# ---------------------------------------------------------------------
# observatory/theme — active retro sci-fi theme (FR-15.2 / phase T.4)
# ---------------------------------------------------------------------
#
# An MQTT `select` entity exposes the six themes as a dropdown in HA.
# The firmware boots to `apollo_amber` (FR-15.2 — no flash persistence)
# and accepts the Director's choice on connect; it also echoes the
# active theme back in `observatory/status.theme` (FR-15.7), which we
# wire to `state_topic` + `value_template` so the UI reflects ground
# truth instead of just the last button press.
#
# Firmware-side wire ids (lowercase enumerator names) are documented
# in MQTT_TOPICS.md → `observatory/theme`. Keep `options` here in sync
# with `theme::Id` in include/theme.h.
#
# command_template wraps the bare option string in the documented
# `{"id":"..."}` envelope so the HA UI doesn't have to know about
# JSON shape. retain: false matches every other observatory topic
# (firmware caches in RAM; first publish on (re)connect re-establishes
# state).

mqtt:
  select:
    - name: "Observatory theme"
      unique_id: observatory_theme
      command_topic: observatory/theme
      command_template: '{"id":"{{ value }}"}'
      state_topic: observatory/status
      value_template: "{{ value_json.theme | default('apollo_amber') }}"
      qos: 1
      retain: false
      options:
        - apollo_amber
        - nostromo_green
        - vectrex_neon
        - blade_runner
        - lcars_tos
        - section_nine
      icon: mdi:palette

  # observatory/theme — image-tint strength (FR-15.6 / phase T.11)
  # ---------------------------------------------------------------
  #
  # MQTT `number` entity exposing the 0..100 % image-tint slider.
  # 0 → every themable BMP renders in its original baked palette
  # under any theme. 100 → full duotone retoning (the pre-T.10
  # behaviour). Default 50 leaves the photo recognisable with a
  # soft theme-coloured cast. Apollo (the passthrough theme) is
  # unaffected at every value — see THEME.md §6.9.
  #
  # Shares command_topic + state_topic with the theme select so a
  # single status heartbeat (FR-15.7) drives both UIs. The firmware
  # accepts `id` and `tint` independently in the same payload, so
  # the slider's `{"tint": N}` envelope never disturbs the active
  # theme id.
  number:
    - name: "Observatory image tint"
      unique_id: observatory_image_tint
      command_topic: observatory/theme
      command_template: '{"tint":{{ value | int }}}'
      state_topic: observatory/status
      value_template: "{{ value_json.image_tint_pct | default(50) }}"
      qos: 1
      retain: false
      min: 0
      max: 100
      step: 5
      unit_of_measurement: "%"
      mode: slider
      icon: mdi:contrast-circle
