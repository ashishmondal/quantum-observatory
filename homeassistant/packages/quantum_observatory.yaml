# Quantum Observatory — Home Assistant package
# =============================================
# Target: HA Core ≥ 2026.2.2  (HA OS ≥ 17.1)
#
# This file uses the modern automation syntax that became canonical
# in 2024.10 / 2024.8:
#   * `triggers:` / `conditions:` / `actions:` (plural list keys)
#   * `trigger: <type>` instead of `platform: <type>`
#   * `action: <domain.service>` instead of `service: <domain.service>`
# The legacy singular forms still parse in 2026.2 but emit deprecation
# warnings on every reload — sticking to the new shape keeps the logs
# clean and is required when 2027.x removes the legacy aliases.
#
# Drop this file into your HA config at:
#     <ha-config>/packages/quantum_observatory.yaml
#
# and ensure the top of your configuration.yaml contains:
#     homeassistant:
#       packages: !include_dir_named packages
#
# Prerequisites in your HA install:
#   1. The standard `mqtt:` integration is configured and pointing at
#      the same broker the Pico W connects to.
#   2. A `home` zone is set with your real latitude/longitude — these
#      are read at runtime via `zone.home`. The firmware was compiled
#      with its own LATITUDE_DEG / LONGITUDE_DEG in include/config.h;
#      keep those in sync with `zone.home` for ISS pass-pointing math
#      to make sense.
#   3. The built-in `sun` and `moon` integrations are enabled
#      (default in any modern HA). `moon` gives us the 8-bucket phase
#      string used by `observatory/moon`.
#
# What this package publishes:
#
#   observatory/time          hourly  — RTC correction (FR-9.5)
#   observatory/iss           30 s    — wheretheiss + open-notify pass-through
#   observatory/scene         rotates priority-2 scenes during evening hours
#
# Three more topics are published from pyscript (NOT this file):
#
#   observatory/planet        15 min  — real az/el for the active body via skyfield
#   observatory/moon          6 h     — exact phase from skyfield
#   observatory/constellation 1 h     — what's actually overhead now
#
# See ../pyscript/observatory_publisher.py. Those three were YAML
# stubs in earlier revisions of this file; they're now commented
# out below (search for "SUPERSEDED BY PYSCRIPT") with explanatory
# headers so you can re-enable them if you uninstall pyscript.
#
# What this package does NOT define any more (FR-20):
#
# The sensor surface — ambient light, DS3231 temperature, render
# diagnostics, MQTT link diagnostics, prefs_dirty, active scene —
# is now auto-discovered from firmware via MQTT Discovery on every
# successful connect. HA shows them under a single "Quantum
# Observatory" device card with no manual `mqtt: sensor:` /
# `mqtt: binary_sensor:` blocks here. The retained
# `observatory/availability` topic (firmware-published `online` +
# broker-published `offline` LWT) drives the unavailable state.
# See docs/MQTT_TOPICS.md → "Home Assistant Device Discovery".
#
# The two `mqtt: select:` (theme) and `mqtt: number:` (image tint)
# blocks at the bottom of this file are intentional exceptions:
# they're stateful inputs the firmware echoes via observatory/status,
# and HA discovery for `select` / `number` write-back entities is a
# follow-up enhancement (FR-20.7).
#
# All publishes use retain=false on purpose. The firmware caches every
# inbound payload for 1–24 h (per topic's `kFreshMs`), so a retained
# message would only matter at first connect — and the automations
# below all run on `homeassistant_started` so we cover that case
# explicitly. Setting retain=true would also leak stale data after
# any HA outage.
#
# All publishes use qos:1 (at-least-once). With qos:0 a transient
# Wi-Fi blip on the firmware side or a momentary broker hiccup
# silently drops the message; the firmware then keeps showing the
# previous (now-stale) state for up to `kFreshMs` of that topic.
# In the field this presented as the planet scene showing the same
# az/el long after a fresh publish was scheduled, because the 15-min
# pyscript publish was lost in flight. qos:1 trades one PUBACK
# round-trip for the broker actually retrying until the firmware
# acknowledges — the right call for low-rate state topics like ours.
# We do NOT use qos:2: the extra 4-way handshake buys nothing here
# (idempotent state replaces idempotent state) and roughly doubles
# broker load per message.

# ---------------------------------------------------------------------
# observatory/time — hourly RTC correction (FR-9.5)
# ---------------------------------------------------------------------

automation observatory_time:
  - id: observatory_time
    alias: "Observatory — push UTC epoch + tz once an hour"
    description: "Keeps the DS3231 within ±1 s of HA's clock."
    # HA 2026.2 syntax: `triggers/conditions/actions` (plural),
    # `trigger:` for trigger-type, `action:` for service call.
    triggers:
      # On HA start (also covers reconnect after HA reboots), then
      # every hour at :00. The firmware's outer RTC poll cadence is
      # also 1 h — overlapping schedules are harmless because the
      # write/read paths are independent.
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: 0
    actions:
      - action: mqtt.publish
        data:
          topic: observatory/time
          # qos: 1 — at-least-once. The firmware caches each topic
          # for `kFreshMs` and falls back to a stale-data UI when no
          # publish arrives in time, so a silently-dropped qos:0
          # message can leave the wrong scene on screen for hours.
          # qos:1 costs one extra PUBACK round-trip; worth it.
          qos: 1
          # epoch_utc range per the doc: 2020-01-01..2100-01-01.
          # tz_offset_min: minutes east of UTC, signed. HA `now()` is
          # tz-aware by default (returns the configured local tz).
          payload: >-
            {{ {
              "epoch_utc": as_timestamp(utcnow()) | int,
              "tz_offset_min": (now().utcoffset().total_seconds() / 60) | int
            } | tojson }}

