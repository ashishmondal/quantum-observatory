; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Shared compile cache — library .o files survive `pio run -t clean` and are
; reused across environments. Big win on the Pico build, where Protomatter +
; Adafruit_GFX dominate compile time.
build_cache_dir = .pio/build_cache

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; Pico W (CYW43439 Wi-Fi). Required by FR-1 / Phase 5.1 onwards — the
; non-W "pico" board id has no Wi-Fi stack. (changed in phase 5.1)
board = rpipicow
framework = arduino
board_build.core = earlephilhower
lib_deps =
    adafruit/Adafruit Protomatter@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
