; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Shared compile cache — library .o files survive `pio run -t clean` and are
; reused across environments. Big win on the Pico build, where Protomatter +
; Adafruit_GFX dominate compile time.
build_cache_dir = .pio/build_cache

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; Pico W (CYW43439 Wi-Fi). Required by FR-1 / Phase 5.1 onwards — the
; non-W "pico" board id has no Wi-Fi stack. (changed in phase 5.1)
board = rpipicow
framework = arduino
board_build.core = earlephilhower
; LittleFS partition for the FR-18 persistent-prefs subsystem
; (Phase P.1). 64 KiB is overkill for a single flat /prefs.json
; (~64 B today, room to grow into the future v2 schema with default
; scene / brightness / mute) but it's the smallest size with enough
; sectors for LittleFS wear-levelling to give the FR-18.6 ≥ 10 yr
; flash-endurance margin. Reduces sketch flash from 2 MiB to ~1.94
; MiB; no impact on the current ~30 % flash usage.
board_build.filesystem_size = 64K
; Pre-build action: convert any assets/*.bmp into include/bitmaps/*.h
; (RGB565 arrays). See tools/bmp_to_header.py for format requirements.
extra_scripts = pre:tools/pre_build.py
; Headers are grouped under include/<category>/ (net, hw, input, astro,
; state, render, diag) to mirror the src/ layout. Adding each as an
; include path keeps every existing `#include "foo.h"` working without
; touching call sites — header file names are globally unique across
; the project, so the flat search remains unambiguous.
build_flags =
    -Iinclude/net
    -Iinclude/hw
    -Iinclude/input
    -Iinclude/astro
    -Iinclude/state
    -Iinclude/render
    -Iinclude/diag
lib_deps =
    adafruit/Adafruit Protomatter@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ; IR remote receiver (on-board IRM @ GP28). v4.x has explicit
    ; arduino-pico (RP2040) support and decodes NEC/Sony/RC5/etc. The
    ; library's implementation lives in IRremote.hpp; include that
    ; header from EXACTLY ONE .cpp (src/ir_remote.cpp) to avoid linker
    ; multiple-definition errors. (added in phase IR.1 — POC)
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#v4.4.1

[env:pico-dev]
; Dev/demo build of the pico env with the giant-clock digit
; animation test triggers wired in. Same firmware as [env:pico]
; otherwise; flip with `pio run -e pico-dev -t upload` when you want
; to exercise the cascading roll without waiting for a real RTC tick.
;
; -DCLOCK_ANIM_TEST enables the MQTT topic
; `observatory/test/clock_anim` with payload
; `{"kind":"minute"|"ten_min"|"hour"}`.
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -DCLOCK_ANIM_TEST
